# ============================================================================
# Pre-commit hooks: ruff (format + lint), mypy (manual / slow), and standard
# hygiene hooks. Install with: `pre-commit install` after `pip install -e .[dev]`.
# ============================================================================
repos:
  # --- Ruff: fast lint + format (replaces black + isort + flake8) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(src|tests|scripts)/
      - id: ruff-format
        files: ^(src|tests|scripts)/

  # --- Mypy: opt-in (manual stage), slow ---
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        stages: [manual]
        args: [--strict, --ignore-missing-imports]
        files: ^src/vc_realtime/
        additional_dependencies:
          - "torch"
          - "torchaudio"
          - "onnxruntime"
          - "numpy>=1.26"
          - "types-PyYAML"

  # --- Standard hygiene hooks ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  # --- CI YAML validator: keep GitHub Actions manifests well-formed ---
  - repo: https://github.com/ibijon/python-yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, "{extends: default, rules: {line-length: disable, document-start: disable}}", -s]
        files: ^\.github/workflows/.*\.ya?ml$
