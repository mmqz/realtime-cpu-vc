[package]
name = "vc-ort"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ort = { workspace = true }
tract-onnx = { workspace = true }
# OPT-13: tract-pulse provides the `pulse(chunk_size)` extension trait that
# converts a full-sequence TypedModel into a chunk-streaming PulsedModel with
# internal state (delay lines). This eliminates the need for SOLA crossfade
# at chunk boundaries — pulsified models maintain streaming state across
# `.run()` calls. Version must track tract-onnx's tract-core minor (0.23.x).
tract-pulse = "0.23"
ndarray = { workspace = true }
thiserror = "1.0"
# anyhow is tract's TractError type alias; needed for `?`-converting tract
# results into our InferError. Re-exported by tract-onnx prelude, but adding
# the dep here makes the `From<anyhow::Error>` impl robust to version skew.
anyhow = "1.0"

[dev-dependencies]
# (none — tests only use workspace deps)

# vc-ort: ONNX inference orchestration in Rust
# Uses `ort` crate (Rust→ONNXRuntime bindings) as primary, `tract-onnx` as fallback
# for ops ORT doesn't support (rare) or for pulsification streaming conversion.
