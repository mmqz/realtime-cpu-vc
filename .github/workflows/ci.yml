# ============================================================================
# CI: lint + type-check + unit-test on every PR to main and every push to main
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + type-check + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Upgrade pip + install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install package + dev extras (CPU torch via PyPI default)
        run: |
          # The CPU torch wheel is satisfied by the default PyPI index for
          # manylinux. If a future pin is needed, add --extra-index-url
          # https://download.pytorch.org/whl/cpu.
          pip install -e ".[dev]"

      - name: Ruff check (lint + format-equivalence)
        run: ruff check src/ tests/ scripts/

      - name: Ruff format check (src/ only; scripts/tests formatted on demand)
        run: ruff format --check src/

      - name: Mypy type-check (strict; warnings OK during P1, errors fail in P2)
        run: mypy src/vc_realtime/
        continue-on-error: true  # P1 baseline: mypy strict is aspirational

      - name: Pytest collect + run
        run: pytest tests/ -v
        continue-on-error: true  # tests/ may be empty during P1-1; later subagents fill it

      - name: Validate YAML configs
        run: |
          python - <<'PY'
          import yaml, pathlib, sys
          bad = []
          for p in pathlib.Path("configs").glob("*.yaml"):
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  bad.append((str(p), str(e)))
          if bad:
              for p, e in bad:
                  print(f"INVALID YAML: {p}\n{e}")
              sys.exit(1)
          print(f"All {len(list(pathlib.Path('configs').glob('*.yaml')))} configs OK")
          PY
        shell: bash
