name: Rust CI
on:
  pull_request:
    paths: ['src_rust/**', 'src_c/**']
  push:
    branches: [main]
    paths: ['src_rust/**', 'src_c/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Install miniaudio deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Cargo test
        working-directory: src_rust
        run: cargo test --release --workspace
      
  wheel:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        working-directory: src_rust/vc-python
        run: maturin build --release
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: vc-python-wheel
          path: src_rust/vc-python/target/wheels/*.whl

  benchmark-regression:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Download previous benchmark
        uses: actions/download-artifact@v4
        with:
          name: benchmark-report
        continue-on-error: true
      - name: Run benchmark
        run: python scripts/benchmark.py --infer-script vc_realtime.infer_v1 --source data/source/source_001.wav --voice-id 0 --ref data/voices/voice_0.wav --output /tmp/bench_out.wav | tee benchmark-current.json
      - name: Compare with baseline
        run: |
          if [ -f benchmark-report.json ]; then
            python3 -c "
            import json
            with open('benchmark-report.json') as f: old = json.load(f)
            with open('benchmark-current.json') as f: new = json.load(f)
            old_rtf = old.get('rtf', 999)
            new_rtf = new.get('rtf', 999)
            regression = (new_rtf - old_rtf) / old_rtf * 100
            print(f'RTF: {old_rtf} -> {new_rtf} ({regression:+.1f}%)')
            if regression > 10:
                print('FAIL: RTF regressed >10%')
                exit(1)
            print('OK: no significant regression')
            "
          else
            echo "No baseline found, skipping comparison"
          fi
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-current.json
